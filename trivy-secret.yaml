# Trivy secret-scanner config (read automatically from the repo root: Trivy's
# default --secret-config is ./trivy-secret.yaml).
#
# The Week 13 sims (labs/live-quiz/static/sim/image-layers.js and
# trivy-blindspot.js) show the FAKE token that labs/week13-cloud-container/
# Dockerfile.insecure plants in an ENV line, because the point of the lesson is
# what `docker history` / `docker inspect` reveal. labs/week*/ is skipped by the
# Trivy gate, but labs/live-quiz is not, so that demo string tripped the
# stripe-secret-token rule. Allowed by exact value and path only: any other
# sk_live_ string, anywhere, still fails the gate.
allow-rules:
  - id: week13-demo-token-in-sims
    description: Fake sk_live_ token from the Week 13 lab, displayed by the Week 13 sims on purpose
    regex: sk_live_supersecret_DO_NOT_DO_
    path: labs/live-quiz/static/sim/(image-layers|trivy-blindspot)\.js
