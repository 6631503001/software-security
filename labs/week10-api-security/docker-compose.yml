services:
  vulnerable-api:
    image: python:3.12-slim
    working_dir: /lab
    volumes:
      - ./:/lab
    ports:
      # 127.0.0.1 = this machine only. Lab apps are deliberately vulnerable; keep them off the classroom network.
      - "127.0.0.1:8080:5000"
    # PRACTICE build: with no .env the app serves public demo flags (FLAG{..._demo}).
    # Graded flags come only from your hosted CTFd instance, never from this local run.
    environment:
      - FLAG_BOLA
      - FLAG_MASSASSIGN
    command: >
      bash -c "pip install --no-cache-dir flask &&
               echo '--- INSECURE API on :8080 — see attack.md ---' &&
               python vulnerable_api.py"

  solution-api:
    image: python:3.12-slim
    working_dir: /lab
    volumes:
      - ./:/lab
    ports:
      # 127.0.0.1 = this machine only. Lab apps are deliberately vulnerable; keep them off the classroom network.
      - "127.0.0.1:8081:5001"
    command: >
      bash -c "pip install --no-cache-dir flask &&
               echo '--- SECURE API on :8081 ---' &&
               python solution_api.py"
