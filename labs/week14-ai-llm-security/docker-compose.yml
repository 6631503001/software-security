services:
  vulnerable-chatbot:
    image: python:3.12-slim
    working_dir: /lab
    volumes:
      - ./:/lab
    ports:
      # 127.0.0.1 = this machine only. Lab apps are deliberately vulnerable; keep them off the classroom network.
      - "127.0.0.1:8082:8082"
    # PRACTICE build: with no .env the app serves public demo flags (FLAG{..._demo}).
    # Graded flags come only from your hosted CTFd instance, never from this local run.
    environment:
      - FLAG_PROMPTINJ
    command: >
      bash -c "pip install --no-cache-dir flask &&
               echo '--- INSECURE chatbot on :8082 — open http://localhost:8082 — see attack.md ---' &&
               python vulnerable_chatbot.py"

  guarded-chatbot:
    image: python:3.12-slim
    working_dir: /lab
    volumes:
      - ./:/lab
    ports:
      # 127.0.0.1 = this machine only. Lab apps are deliberately vulnerable; keep them off the classroom network.
      - "127.0.0.1:8083:8083"
    # PRACTICE build: with no .env the app serves public demo flags (FLAG{..._demo}).
    # Graded flags come only from your hosted CTFd instance, never from this local run.
    environment:
      - FLAG_PROMPTINJ
    command: >
      bash -c "pip install --no-cache-dir flask &&
               echo '--- GUARDED chatbot on :8083 — open http://localhost:8083 ---' &&
               python guarded_chatbot.py"
