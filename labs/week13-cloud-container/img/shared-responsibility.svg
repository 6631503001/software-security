<rect class="bg" x="0" y="0" width="900" height="400"/>

<text class="h1" x="24" y="34">Shared responsibility — every lab flag is on your side of the line</text>
<text class="h2" x="24" y="56">harden.md: “The cloud provider secures of the cloud; you secure what you put in it.”</text>

<!-- provider panel -->
<rect class="panP" x="24" y="74" width="300" height="262" rx="10"/>
<text class="capP" x="42" y="103">AWS — secures OF the cloud</text>
<text class="capS" x="42" y="123">you rent it; you can't misconfigure it</text>
<line class="rule" x1="42" y1="138" x2="306" y2="138"/>
<text class="itemM" x="42" y="168">Data centres, power, hardware</text>
<text class="itemM" x="42" y="204">Hypervisor and host OS</text>
<text class="itemM" x="42" y="240">The S3 and IAM services</text>
<text class="itemM" x="42" y="276">The global network</text>
<text class="capS" x="42" y="318">a breach here is rare — and not yours</text>

<!-- the line -->
<path class="divl" d="M342,70 V340"/>
<text class="divt" x="342" y="358" text-anchor="middle">THE LINE</text>

<!-- your panel -->
<rect class="panY" x="360" y="74" width="516" height="262" rx="10"/>
<text class="capY" x="378" y="103">YOU — secure what you put IN it</text>
<text class="capS" x="378" y="123">every file in this lab lives here</text>
<line class="rule" x1="378" y1="138" x2="858" y2="138"/>

<text class="item" x="378" y="166">IAM policy — who may do what</text>
<text class="code" x="378" y="185">iam-policy-insecure.json</text>
<rect class="pill" x="772" y="152" width="86" height="28" rx="14"/>
<text class="pillt" x="815" y="171" text-anchor="middle">3 flags</text>

<text class="item" x="378" y="222">Container image — incl. the ENV secret</text>
<text class="code" x="378" y="241">Dockerfile.insecure</text>
<rect class="pill" x="772" y="208" width="86" height="28" rx="14"/>
<text class="pillt" x="815" y="227" text-anchor="middle">6 flags</text>

<text class="item" x="378" y="276">Bucket access and encryption</text>
<text class="code" x="378" y="295">public or private is your setting</text>
<rect class="pillO" x="742" y="262" width="116" height="26" rx="13"/>
<text class="pillOt" x="800" y="280" text-anchor="middle">not graded here</text>

<text class="item" x="378" y="322">Network rules — 0.0.0.0/0 on a DB port</text>
<rect class="pillO" x="742" y="306" width="116" height="26" rx="13"/>
<text class="pillOt" x="800" y="324" text-anchor="middle">not graded here</text>

<text class="punch" x="24" y="388">All 9 Misconfig Hunt flags sit in your half. None of them is a provider bug.</text>
</svg>
