<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="The shared-responsibility split for this lab's S3-backed app, drawn as two panels divided by a line. The left panel, the provider, AWS, secures OF the cloud: the data centres, power and hardware; the hypervisor and host operating system; the S3 and IAM services themselves; and the global network. The right panel, you, secure what you put IN the cloud, and every artifact this lab ships sits there: the IAM policy, iam-policy-insecure.json, holds 3 Misconfig Hunt flags (Action star, Resource star, no Condition); the container image, Dockerfile.insecure, holds 6 flags including the secret baked into ENV; bucket access and encryption, public or private, are your setting; and network exposure such as 0.0.0.0/0 on a database port is your rule. The conclusion: all 9 Misconfig Hunt flags sit in your half, and none of them is a provider bug.">
<title>Shared responsibility — every lab flag is on your side of the line</title>
