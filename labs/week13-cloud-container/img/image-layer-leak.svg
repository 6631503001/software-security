<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Where the secret in Dockerfile.insecure ends up once the image is built, from a real build of week13-insecure:lab. On the left, the image's history as a stack, newest at the top: CMD, EXPOSE 5000, RUN chmod -R 777 /app at 77.8 kB, RUN pip install at 19.1 MB, COPY dot dot at 77.8 kB, WORKDIR /app, then ENV AWS_SECRET_ACCESS_KEY and ENV API_TOKEN, each 0 bytes, and at the bottom the 11 layers of python:latest. The two ENV rows are highlighted: they are 0 bytes because the value is not a file, it is written into the image config that ships with every pull. On the right, three ways to read it back. One: plain docker history truncates the row at 45 characters but still prints sk_live_supersecret_DO_NOT_DO_ followed by an ellipsis, 30 of the token's 34 characters. Two: docker history --no-trunc prints the full ENV API_TOKEN=sk_live_supersecret_DO_NOT_DO_THIS, which is the Task 3 command. Three: docker inspect .Config.Env prints both secrets in full, and every process in the container inherits them. A fourth arrow from the COPY dot dot layer: it copied Dockerfile.insecure itself into /app, so the secret is also in a file. The fix along the bottom: never write the secret into the Dockerfile; inject it at run time from a mounted secret or secrets manager, then rotate the leaked key, because every existing copy of the image keeps it.">
<title>One ENV line, three ways to read it back</title>
