<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 524" role="img" aria-label="Task 1b at a glance. Step one: from the lab folder, docker compose up starts two containers from the same python:3.12-slim image. Both mount the same lab folder, install Flask, and run a different file: insecure-service runs insecure_service.py on localhost port 8090, and secure-service runs secure_service.py on localhost port 8091. Step two: as Red, send the same request to both, GET /admin with no Authorization header. Port 8090 answers 200 with panel UNLOCKED and the secret FLAG, because USERS square-bracket token raises KeyError and the except branch grants access. Port 8091 answers 403 with error forbidden, because USERS dot get returns None and the code denies. Step three: read docker compose logs. The insecure service prints only the web server's access line, GET /admin HTTP/1.1 200, so the attack looks like a normal success and there is nothing to alert on, which is OWASP A09. The secure service prints a WARNING on the security logger, event=authz_failure outcome=deny src_ip and reason=unauthenticated, followed by the access line with 403. Step four, the anti-cheat check: the same request with alice-token still unlocks port 8091, and the auto-grader passes a hardened box only if every bypass is blocked and a real admin still gets in. Submit the flag, both responses, and the except line in insecure_service.py that fails open. A local run returns the public demo value; the graded flag comes from your hosted instance.">
<title>Task 1b at a glance: one compose file, two services, the same request</title>
