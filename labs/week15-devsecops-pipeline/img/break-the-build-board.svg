<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" role="img" aria-label="The Break the Build game board: which gate step each change turns red, measured by running security-ci.yml's own gate commands on the real lab files. Columns are the four gate steps: the Semgrep gate (--error, any finding), the Trivy SCA gate (fs scan with the vuln and secret scanners, HIGH and CRITICAL), the Trivy IaC gate (config scan, HIGH and CRITICAL), and the Gitleaks gate (any secret). First group, Blue's baseline, which is red before Red does anything and is Task 3's job to clear: the unpinned uses at v4 and v3 action tags trip Semgrep's github-actions-mutable-action-tag; host 0.0.0.0 in the two services trips Semgrep's avoid_app_run_with_bad_host; and the docs' own curl examples that send the toy alice-token header trip Gitleaks' curl-auth-header, a false positive. Trivy is green on the untouched lab. Second group, Red's three attacks, one per pull request once Blue is green: urllib3 1.24.1 in requirements.txt trips only the Trivy SCA gate, with, for example, 7 HIGH CVEs such as CVE-2019-11324 in the 23 Oct 2026 capture; the count varies with the Trivy DB. A Dockerfile with no USER line or with USER root trips the Trivy IaC gate with DS-0002 HIGH, and also Semgrep, through missing-user or last-user-is-root: a cross-hit. A GitHub-format ghp token in settings.py trips Gitleaks with github-pat and also the Trivy SCA gate, because that step runs the secret scanner too, where it is a CRITICAL github-pat finding: another cross-hit. Third group, the decoys, which stay green: chmod 777 in a Dockerfile that keeps a non-root USER has no rule anywhere, and FROM python latest is seen by Trivy as DS-0001 MEDIUM, which the HIGH and CRITICAL filter drops. One defect per pull request: inside a job, the first failing gate skips the gates after it.">
<title>Break the Build: which gate step each planted defect turns red</title>
