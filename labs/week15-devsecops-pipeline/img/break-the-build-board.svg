<rect class="bg" x="0" y="0" width="960" height="568"/>

<text class="h1"  x="24" y="34">Break the Build: what each change turns red</text>
<text class="sub" x="24" y="55">Measured by running security-ci.yml's own gate commands on the real lab files (Trivy 0.70.0 · Semgrep · Gitleaks)</text>

<!-- column headers -->
<rect class="colb" x="332" y="70" width="148" height="46" rx="6"/>
<text class="ch" x="344" y="90">Semgrep gate</text>
<text class="cs" x="344" y="107">--error · any finding</text>
<rect class="colb" x="486" y="70" width="148" height="46" rx="6"/>
<text class="ch" x="498" y="90">Trivy SCA gate</text>
<text class="cs" x="498" y="107">vuln + secret · HIGH+</text>
<rect class="colb" x="640" y="70" width="148" height="46" rx="6"/>
<text class="ch" x="652" y="90">Trivy IaC gate</text>
<text class="cs" x="652" y="107">Dockerfile · HIGH+</text>
<rect class="colb" x="794" y="70" width="148" height="46" rx="6"/>
<text class="ch" x="806" y="90">Gitleaks gate</text>
<text class="cs" x="806" y="107">any secret fails</text>

<!-- ================= GROUP 1 : BLUE'S BASELINE ================= -->
<text class="grpb" x="24" y="138">BLUE'S BASELINE</text>
<text class="grps" x="176" y="138">red before Red does anything · Task 3 clears it (fix, or justify with a reason)</text>

<rect class="row" x="24" y="146" width="918" height="36" rx="5"/>
<text class="rt mono" x="36" y="169">uses: …@v4 / @v3 tags</text>
<rect class="hit" x="336" y="150" width="140" height="28" rx="4"/>
<text class="ht" x="346" y="168">mutable-action-tag</text>
<text class="dot" x="560" y="170" text-anchor="middle">·</text>
<text class="dot" x="714" y="170" text-anchor="middle">·</text>
<text class="dot" x="868" y="170" text-anchor="middle">·</text>

<rect class="row" x="24" y="186" width="918" height="36" rx="5"/>
<text class="rt mono" x="36" y="209">app.run(host="0.0.0.0")</text>
<rect class="hit" x="336" y="190" width="140" height="28" rx="4"/>
<text class="ht" x="346" y="208">bad_host ×2</text>
<text class="dot" x="560" y="210" text-anchor="middle">·</text>
<text class="dot" x="714" y="210" text-anchor="middle">·</text>
<text class="dot" x="868" y="210" text-anchor="middle">·</text>

<rect class="row" x="24" y="226" width="918" height="40" rx="5"/>
<text class="rt" x="36" y="243">docs' curl examples with the</text>
<text class="rs" x="36" y="257">toy alice-token header</text>
<text class="dot" x="406" y="250" text-anchor="middle">·</text>
<text class="dot" x="560" y="250" text-anchor="middle">·</text>
<text class="dot" x="714" y="250" text-anchor="middle">·</text>
<rect class="hit" x="798" y="230" width="140" height="32" rx="4"/>
<text class="ht" x="808" y="244">curl-auth-header ×3</text>
<text class="hs" x="808" y="257">false positive</text>

<!-- ================= GROUP 2 : RED'S ATTACKS ================= -->
<text class="grpr" x="24" y="290">RED'S ATTACKS</text>
<text class="grps" x="160" y="290">on top of Blue's green baseline · one per PR</text>
<text class="rs" x="480" y="290">*23 Oct 2026; count varies with Trivy DB</text>

<rect class="row" x="24" y="298" width="918" height="40" rx="5"/>
<text class="rt mono" x="36" y="316">urllib3==1.24.1</text>
<text class="rs" x="36" y="331">requirements.txt</text>
<text class="dot" x="406" y="324" text-anchor="middle">·</text>
<rect class="hit" x="490" y="302" width="140" height="32" rx="4"/>
<text class="ht" x="500" y="316">e.g. 7 HIGH CVEs*</text>
<text class="hs" x="500" y="329">e.g. CVE-2019-11324</text>
<text class="dot" x="714" y="324" text-anchor="middle">·</text>
<text class="dot" x="868" y="324" text-anchor="middle">·</text>

<rect class="row" x="24" y="342" width="918" height="40" rx="5"/>
<text class="rt" x="36" y="360">Dockerfile runs as root</text>
<text class="rs mono" x="36" y="375">no USER line, or USER root</text>
<rect class="xhit lesson-crosshit" x="336" y="346" width="140" height="32" rx="4"/>
<text class="ht" x="346" y="360">missing-user /</text>
<text class="hs" x="346" y="373">last-user-is-root</text>
<text class="dot" x="560" y="368" text-anchor="middle">·</text>
<rect class="hit lesson-crosshit" x="644" y="346" width="140" height="32" rx="4"/>
<text class="ht" x="654" y="360">DS-0002 HIGH</text>
<text class="hs" x="654" y="373">root user</text>
<text class="dot" x="868" y="368" text-anchor="middle">·</text>

<rect class="row" x="24" y="386" width="918" height="40" rx="5"/>
<text class="rt mono" x="36" y="404">GITHUB_TOKEN = "ghp_…"</text>
<text class="rs" x="36" y="419">settings.py, a GitHub-format token</text>
<text class="dot" x="406" y="412" text-anchor="middle">·</text>
<rect class="xhit" x="490" y="390" width="140" height="32" rx="4"/>
<text class="ht" x="500" y="404">github-pat</text>
<text class="hs" x="500" y="417">secret · CRITICAL</text>
<text class="dot" x="714" y="412" text-anchor="middle">·</text>
<rect class="hit" x="798" y="390" width="140" height="32" rx="4"/>
<text class="ht" x="808" y="404">github-pat</text>
<text class="hs" x="808" y="417">settings.py:2</text>

<!-- ================= GROUP 3 : DECOYS ================= -->
<text class="grpg" x="24" y="450">DECOYS</text>
<text class="grps" x="88" y="450">stay green (a Dockerfile that keeps a non-root USER)</text>

<rect class="row" x="24" y="458" width="918" height="30" rx="5"/>
<text class="rt mono" x="36" y="478">RUN … chmod 777</text>
<text class="dot" x="406" y="478" text-anchor="middle">·</text>
<text class="dot" x="560" y="478" text-anchor="middle">·</text>
<text class="st" x="714" y="478" text-anchor="middle">no rule exists</text>
<text class="dot" x="868" y="478" text-anchor="middle">·</text>

<rect class="row" x="24" y="492" width="918" height="40" rx="5"/>
<text class="rt mono" x="36" y="517">FROM python:latest</text>
<text class="dot" x="406" y="517" text-anchor="middle">·</text>
<text class="dot" x="560" y="517" text-anchor="middle">·</text>
<rect class="seen" x="644" y="496" width="140" height="32" rx="4"/>
<text class="st" x="654" y="510">DS-0001 MEDIUM</text>
<text class="rs" x="654" y="523">seen, then filtered</text>
<text class="dot" x="868" y="517" text-anchor="middle">·</text>

<!-- legend / rule of the game -->
<rect class="hit"  x="24"  y="545" width="14" height="10" rx="2"/>
<text class="rs" x="44" y="554">gate fails</text>
<rect class="xhit" x="118" y="545" width="14" height="10" rx="2"/>
<text class="rs" x="138" y="554">cross-hit: the same defect also fails a second job</text>
<text class="rs" x="470" y="554">Two defects in one job? The first red gate skips the next, so plant one per PR.</text>
</svg>
