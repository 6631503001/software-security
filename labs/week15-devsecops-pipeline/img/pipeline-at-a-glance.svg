  .sub   { fill: #9aa3ad; }
  .colh  { fill: #4aa3dd; }
  .colhg { fill: #ff9b63; }
  .cols  { fill: #9aa3ad; }
  .trig  { fill: #e8edf2; }
  .trigt { fill: #0f1419; }
  .trigs { fill: #31404d; }
  .job   { fill: #1e262e; stroke: #31404d; }
  .jt    { fill: #e8edf2; }
  .js    { fill: #4aa3dd; }
  .jn    { fill: #9aa3ad; }
  .cell  { fill: #171d24; stroke: #31404d; }
  .gate  { fill: #3a2213; stroke: #ff7a3d; }
  .ct    { fill: #dde4ea; }
  .cb    { fill: #e8edf2; }
  .cm    { fill: #9aa3ad; }
  .ok    { fill: #4aa3dd; }
  .no    { fill: #ff9b63; }
  .wire  { stroke: #4c6070; }
  .wireg { stroke: #ff7a3d; }
