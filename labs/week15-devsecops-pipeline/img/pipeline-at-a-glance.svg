.trigt { fill: #ffffff; font-size: 14px; font-weight: 700; }
.trigs { fill: #d6dee5; font-size: 11.5px; }
.job   { fill: #f2f6f9; stroke: #c9d4de; stroke-width: 1.2; }
.jt    { fill: #12232e; font-size: 16px; font-weight: 700; }
.js    { fill: #017BC4; font-size: 12.5px; font-weight: 700; }
.jn    { fill: #6b7280; font-size: 11.5px; }
.cell  { fill: #ffffff; stroke: #c9d4de; stroke-width: 1.2; }
.gate  { fill: #fdeee4; stroke: #E35205; stroke-width: 1.8; }
.ct    { fill: #1f2933; font-size: 12.5px; }
.cb    { fill: #12232e; font-size: 12.5px; font-weight: 700; }
.cm    { fill: #6b7280; font-size: 11.5px; }
.ok    { fill: #017BC4; font-size: 12px; font-weight: 700; }
.no    { fill: #b34205; font-size: 12px; font-weight: 700; }
.wire  { stroke: #9fb8c9; stroke-width: 1.6; fill: none; }
.wireg { stroke: #E35205; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
.wireb { stroke: #017BC4; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
.head  { fill: #9fb8c9; }
.headg { fill: #E35205; }
.headb { fill: #017BC4; }
.sinkb { fill: #e9f2f9; stroke: #017BC4; stroke-width: 1.6; }
.sinkg { fill: #fdeee4; stroke: #E35205; stroke-width: 1.8; }
.st    { fill: #12232e; font-size: 14px; font-weight: 700; }
.sb    { fill: #1f2933; font-size: 12.5px; }
.foot  { fill: #6b7280; font-size: 11.5px; }
