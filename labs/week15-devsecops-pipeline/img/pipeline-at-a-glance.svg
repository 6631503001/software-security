<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-label="The security-ci.yml pipeline at a glance. A push or pull request to main starts three jobs in parallel, each with the least-privilege token contents read and security-events write. Every job has the same three phases. Phase one is the report run, which never fails the build: Semgrep scans with the p/default and p/owasp-top-ten rulesets into SARIF with or-true; Trivy runs a filesystem scan with the vuln and secret scanners and a config scan of the Dockerfile and IaC, both with exit-code 0; Gitleaks scans the whole git history, because checkout uses fetch-depth 0, with exit-code 0. Phase two uploads each SARIF file with if always. All of it lands in the GitHub Security tab as code-scanning alerts, at every severity, because trivy-action drops the severity filter for SARIF unless limit-severities-for-sarif is set. Phase three is the gate, the only step that can fail the build. Semgrep's gate uses --error with no severity filter, so any finding fails. Trivy has two gates, SCA then IaC, both exit-code 1 and filtered to HIGH and CRITICAL; if the SCA gate fails, the IaC gate is skipped. Gitleaks' gate uses exit-code 1 with no severity filter, so any secret fails. Any red gate turns the build red. The report shows you everything; the gate decides.">
<title>The security-ci.yml pipeline at a glance: report first, gate last</title>
<style>
