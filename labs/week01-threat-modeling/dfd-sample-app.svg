<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- trust boundary (dashed) -->
  <rect x="260" y="50" width="460" height="340" fill="#eef3fa" stroke="#888" stroke-width="2" stroke-dasharray="9 6" rx="8"/>
  <text x="490" y="80" font-size="13" fill="#556" text-anchor="middle">trust boundary — Internet → app (no auth / validation check)</text>

  <!-- external entity: web client -->
  <rect x="30" y="180" width="180" height="80" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="120" y="212" font-size="15" text-anchor="middle">Web client</text>
  <text x="120" y="232" font-size="11" fill="#666" font-style="italic" text-anchor="middle">external entity</text>

  <!-- process: flask app -->
  <rect x="350" y="180" width="160" height="80" rx="6" fill="#d9ead3" stroke="#333" stroke-width="2"/>
  <text x="430" y="212" font-size="15" text-anchor="middle">Flask app</text>
  <text x="430" y="232" font-size="11" fill="#555" font-style="italic" text-anchor="middle">process</text>

  <!-- data store: notes.db -->
  <rect x="600" y="80" width="110" height="60" rx="6" fill="#fff7e0" stroke="#333" stroke-width="2"/>
  <text x="655" y="106" font-size="13" text-anchor="middle">notes.db</text>
  <text x="655" y="124" font-size="10" fill="#666" font-style="italic" text-anchor="middle">data store</text>

  <!-- data store: uploads/ -->
  <rect x="600" y="290" width="110" height="60" rx="6" fill="#fde7e3" stroke="#333" stroke-width="2"/>
  <text x="655" y="316" font-size="13" text-anchor="middle">uploads/</text>
  <text x="655" y="334" font-size="10" fill="#666" font-style="italic" text-anchor="middle">data store</text>

  <!-- flows -->
  <line x1="210" y1="220" x2="345" y2="220" stroke="#444" stroke-width="2" marker-end="url(#arw)"/>
  <text x="278" y="208" font-size="11" fill="#333" text-anchor="middle">POST/GET /notes · POST /upload · GET /files/&lt;name&gt;</text>

  <line x1="430" y1="180" x2="620" y2="140" stroke="#444" stroke-width="2" marker-end="url(#arw)"/>
  <text x="520" y="148" font-size="11" fill="#333" text-anchor="middle">INSERT / SELECT</text>

  <line x1="430" y1="260" x2="620" y2="320" stroke="#444" stroke-width="2" marker-end="url(#arw)"/>
  <text x="510" y="300" font-size="11" fill="#333" text-anchor="middle">f.save() / serve</text>

  <text x="490" y="420" font-size="11" fill="#888" text-anchor="middle">Threat model — sample-app (Week 1) · Gritthaphat Intaraprasit · 6631503001</text>
</svg>
